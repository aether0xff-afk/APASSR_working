name: Public Text Clue Dataset

on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources: juice,nyu"
        required: false
        default: "juice,nyu"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install scikit-learn pandas joblib
      - run: python -m compileall pentesting_rl
      - name: Collect public text clue data
        shell: bash
        run: |
          SOURCES="${{ github.event.inputs.sources || 'juice,nyu' }}"
          python -m pentesting_rl.public_text_clue_collector_v3 \
            --sources "$SOURCES" \
            --out-dir runs/public_text_clues \
            --max-lines-per-file 120 \
            --max-files 180 \
            --max-per-label 300 \
            --max-noise 180
      - name: Train text clue classifier
        run: |
          python -m pentesting_rl.text_clue_classifier \
            --data-dir runs/public_text_clues \
            --out-dir runs/text_clue_classifier \
            --save-model
      - name: Print dataset and classifier summaries
        run: |
          cat runs/public_text_clues/public_text_clues_summary.json
          cat runs/text_clue_classifier/metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-text-clue-data
          path: |
            runs/public_text_clues/public_text_clues_all.csv
            runs/public_text_clues/public_text_clues_train.csv
            runs/public_text_clues/public_text_clues_val.csv
            runs/public_text_clues/public_text_clues_test.csv
            runs/public_text_clues/public_text_clues_summary.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-clue-classifier-results
          path: |
            runs/text_clue_classifier/metrics.json
            runs/text_clue_classifier/confusion_train.csv
            runs/text_clue_classifier/confusion_val.csv
            runs/text_clue_classifier/confusion_test.csv
            runs/text_clue_classifier/predictions_train.csv
            runs/text_clue_classifier/predictions_val.csv
            runs/text_clue_classifier/predictions_test.csv
            runs/text_clue_classifier/misclassified_train.csv
            runs/text_clue_classifier/misclassified_val.csv
            runs/text_clue_classifier/misclassified_test.csv
            runs/text_clue_classifier/text_clue_classifier.joblib
          if-no-files-found: warn
