name: KSEF Paper Trace

on:
  push:
    branches: ["v2"]
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y nmap
      - run: python -m compileall pentesting_rl
      - run: python -m pentesting_rl.paper_trace --runs 5 --steps 10 --out-dir runs/paper_trace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-trace-results
          path: runs/paper_trace/paper_eval_steps.csv
          if-no-files-found: warn
